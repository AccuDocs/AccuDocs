<div class="windows-command-bar" *ngIf="viewState$ | async as state">

  <div class="command-group">
    <!-- Back Button with hover-expand text -->
    <button class="command-icon-button go-back-btn" [disabled]="!canGoBack()" (click)="onBack()" matTooltip="Go back to previous folder">
      <ng-icon name="heroArrowLeftSolid" size="18"></ng-icon>
    </button>

    <div class="command-divider"></div>

    <!-- New Folder Button -->
    <button *ngIf="showNewFolder()" class="command-button" type="button" (click)="onNewFolder()"
      matTooltip="Create new folder">
      <ng-icon name="heroFolderPlusSolid" size="16"></ng-icon>
      <span>New</span>
    </button>

    <!-- Upload Button -->
    <button *ngIf="showUpload()" class="command-button" type="button" (click)="onUpload()" matTooltip="Upload files">
      <ng-icon name="heroArrowUpTraySolid" size="16"></ng-icon>
      <span>Upload</span>
    </button>

    <!-- Refresh Button -->
    <button class="command-button" type="button" (click)="onRefresh()" matTooltip="Refresh contents">
      <ng-icon name="heroArrowPathSolid" size="16"></ng-icon>
      <span>Refresh</span>
    </button>

    <div class="command-divider"></div>

    <!-- View Options Dropdown -->
    <button mat-button [matMenuTriggerFor]="viewMenu" class="toolbar-dropdown-btn command-button">
      <ng-icon name="heroSquares2x2Solid" size="16"></ng-icon>
      <span>View</span>
      <ng-icon name="heroChevronDownSolid" size="13" class="chevron-icon"></ng-icon>
    </button>
    <mat-menu #viewMenu="matMenu" class="file-explorer-menu">
      <div class="px-4 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Layout</div>
      <button mat-menu-item *ngFor="let mode of viewModes" (click)="setView(mode.value)"
        [class.is-active]="state.viewMode === mode.value">
        <mat-icon>{{ mode.icon }}</mat-icon>
        <span>{{ mode.label }}</span>
      </button>

      <div
        class="px-4 py-2 mt-2 text-xs font-bold text-slate-400 uppercase tracking-wider border-t border-slate-100 dark:border-slate-800">
        Panes</div>
      <button mat-menu-item (click)="toggleDetails(state.showDetails)">
        <mat-icon>{{ state.showDetails ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
        <span>Details Pane</span>
      </button>
      <button mat-menu-item (click)="togglePreview(state.showPreview)">
        <mat-icon>{{ state.showPreview ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
        <span>Preview Pane</span>
      </button>
    </mat-menu>

    <!-- Sort Dropdown -->
    <button mat-button [matMenuTriggerFor]="sortMenu" class="toolbar-dropdown-btn command-button">
      <ng-icon name="heroArrowsUpDownSolid" size="16"></ng-icon>
      <span>Sort</span>
      <ng-icon name="heroChevronDownSolid" size="13" class="chevron-icon"></ng-icon>
    </button>
    <mat-menu #sortMenu="matMenu" class="file-explorer-menu">
      <button mat-menu-item (click)="sort('name')">Name</button>
      <button mat-menu-item (click)="sort('date')">Date Modified</button>
      <button mat-menu-item (click)="sort('type')">Type</button>
      <button mat-menu-item (click)="sort('size')">Size</button>
    </mat-menu>
  </div>
</div>
